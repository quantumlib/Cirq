name: Apply Cirq review fixes

"on":
  push:
    branches: ["fix/6560-tag-circuit-diagram-info"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/6560-tag-circuit-diagram-info
          fetch-depth: 0

      - name: Apply requested changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_in_cirq(needle: str, replacement: str) -> None:
              result = subprocess.run(
                  ['git', 'grep', '-l', needle, '--', 'cirq-core'],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              for filename in result.stdout.splitlines():
                  path = Path(filename)
                  path.write_text(path.read_text().replace(needle, replacement))

          replace_in_cirq('format_tags_for_diagram(', 'format_tags(')
          replace_in_cirq('tag_diagram_str(', '_tag_diagram_str(')

          raw_types = Path('cirq-core/cirq/ops/raw_types.py')
          lines = raw_types.read_text().splitlines()
          start = next(
              i
              for i, line in enumerate(lines)
              if line.strip()
              == 'sub_op_info = protocols.circuit_diagram_info(self.sub_operation, args, NotImplemented)'
          )
          end = start
          while lines[end].strip() != 'return sub_op_info':
              end += 1
          lines[start : end + 1] = [
              '        sub_op_info = protocols.circuit_diagram_info(self.sub_operation, args, NotImplemented)',
              '        if sub_op_info is NotImplemented or not sub_op_info.wire_symbols:',
              '            return sub_op_info',
              '        tag_text = args.format_tags(self._tags)',
              '        if not tag_text:',
              '            return sub_op_info',
              '        return sub_op_info.with_wire_symbols(',
              '            (sub_op_info.wire_symbols[0] + tag_text, *sub_op_info.wire_symbols[1:])',
              '        )',
          ]
          raw_types.write_text('\n'.join(lines) + '\n')
          PY

      - name: Verify syntax
        run: |
          python -m compileall -q \
            cirq-core/cirq/ops/raw_types.py \
            cirq-core/cirq/protocols/circuit_diagram_info_protocol.py
          ! git grep -n 'format_tags_for_diagram(' -- cirq-core
          ! git grep -n -E 'def tag_diagram_str|\.tag_diagram_str\(' -- cirq-core

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/branch-fix.yml
          git config user.name sankalpsthakur
          git config user.email 31366524+sankalpsthakur@users.noreply.github.com
          git add -A
          git commit -m 'Address circuit diagram review feedback'
          git push origin HEAD:fix/6560-tag-circuit-diagram-info
