name: Scorecard analysis
run-name: Run Scorecard scanner for security best practices

# Scorecard (https://github.com/ossf/scorecard) is a repository-scanning tool
# that evaluates a project's security practices. Its use is suggested by
# Google's GitHub team. Scorecard's findings are reported in a repo's scanning
# results page, https://github.com/quantumlib/REPO/security/code-scanning/.

on:
  schedule:
    # Run weekly on Saturdays.
    - cron: '30 9 * * 6'

  pull_request:
    types: [opened, synchronize]
    branches:
      - main

  # Allow manual invocation.
  workflow_dispatch:

concurrency:
  # Cancel any previously-started but still active runs on the same branch.
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.event.pull_request.number||github.ref}}

permissions: {}

jobs:
  run-scorecard:
    if: github.repository_owner == 'quantumlib'
    name: Scorecard analyzer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Check out a copy of the git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        # yamllint disable rule:line-length
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # Save the results
          results_file: raw-scorecard-results.sarif
          results_format: sarif
          # See https://github.com/ossf/scorecard-action#publishing-results.
          publish_results: true

      - name: Filter results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          # The cifuzz action version cannot be pinned to a hash. Filter out those results to avoid
          # repeated warnings that we can't do anything about.
          patterns: |
            -.github/workflows/cifuzz.yml:actions/unpinned-tag
          input: raw-scorecard-results.sarif
          output: scorecard-results.sarif

      - name: Upload results to code-scanning dashboard
        # yamllint disable rule:line-length
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: scorecard-results.sarif
