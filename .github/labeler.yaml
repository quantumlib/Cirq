# Skip changed-files labels when a wide refactor would add more than this many.
changed-files-labels-limit: 5

# --- Hardware provider interfaces ---

interface/cirq-ionq:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-ionq/**'
          - 'docs/hardware/ionq/**'

interface/cirq-aqt:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-aqt/**'
          - 'docs/hardware/aqt/**'

interface/cirq-pasqal:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-pasqal/**'
          - 'docs/hardware/pasqal/**'

# --- Google Quantum Engine sub-areas ---

area/google/engine:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/engine/**'

area/google/device:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/devices/**'

area/google/calibrations:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/devices/calibrations/**'
          - 'cirq-google/cirq_google/engine/*calibration*'
          - 'cirq-google/cirq_google/ops/calibration_tag*'
          - 'docs/google/calibration.md'
          - 'docs/tutorials/google/visualizing_calibration_metrics.ipynb'

area/google/placement:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/line/**'
          - 'cirq-google/cirq_google/workflow/qubit_placement*'
          - 'docs/google/qubit-placement.ipynb'

area/google/protos:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/api/**'
          - 'cirq-google/cirq_google/cloud/**'
          - 'dev_tools/build-protos.sh'

area/google:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/**'
          - 'docs/google/**'
          - 'docs/tutorials/google/**'

# --- Cirq core sub-areas ---

area/gates:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/ops/**'
          - 'cirq-google/cirq_google/ops/**'
          - 'cirq-core/cirq/ion/**'
          - 'cirq-core/cirq/neutral_atoms/*gates*'

area/simulation:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/sim/**'
          - 'docs/simulate/**'

area/transformers:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/transformers/**'
          - 'cirq-google/cirq_google/transformers/**'
          - 'docs/transform/**'

area/experiments:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/experiments/**'
          - 'cirq-google/cirq_google/experimental/**'
          - 'docs/experiments/**'

area/protocols:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/protocols/**'

area/linalg:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/linalg/**'

area/devices:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/devices/**'
          - 'cirq-core/cirq/neutral_atoms/**'
          - 'cirq-core/cirq/ion/**'
          - 'docs/hardware/*.ipynb'

area/circuits:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/circuits/**'

area/contrib:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/contrib/**'

area/workflow:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/work/**'
          - 'cirq-google/cirq_google/workflow/**'

area/parameters:
  # Exclude result* modules under study/ because they map to area/result.
  - changed-files:
      - all-globs-to-any-file:
          - 'cirq-core/cirq/study/**'
          - '!cirq-core/cirq/study/result*'
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/study/**'

area/result:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/study/result*'
          - 'cirq-google/cirq_google/engine/engine_result*'
          - 'cirq-ionq/cirq_ionq/results*'

area/classical:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/value/*classical*'
          - 'cirq-core/cirq/value/*condition*'
          - 'cirq-core/cirq/value/measurement_key*'
          - 'cirq-core/cirq/ops/classically_controlled_operation*'
          - 'cirq-core/cirq/protocols/control_key_protocol*'
          - 'cirq-core/cirq/sim/classical_simulator*'
          - 'docs/build/classical_control.ipynb'

area/qis:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/qis/**'

area/visualization:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/vis/**'

area/interop:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/interop/**'

area/serialization:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-google/cirq_google/serialization/**'
          - 'cirq-ionq/cirq_ionq/serializer*'
          - 'cirq-core/cirq/protocols/json_serialization*'
          - 'cirq-core/cirq/contrib/json*.py'
          - '**/json_resolver_cache.py'
          - '**/json_test_data/**'
          - 'docs/dev/serialization.md'

area/routing:
  - changed-files:
      - any-glob-to-any-file:
          - 'cirq-core/cirq/transformers/routing/**'
          - 'cirq-core/cirq/contrib/routing/**'

area/noise:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*noise*.py'
          - 'cirq-core/cirq/contrib/noise_models/**'
          - 'cirq-google/cirq_google/experimental/noise_models/**'
          - 'docs/noise/**'

# --- Repository infrastructure ---

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - '.github/SECURITY.md'
          - 'AUTHORS'
          - 'CITATION.cff'
          - 'dev_tools/docs/**'
          - 'dev_tools/notebooks/**'
          - 'docs/**'
          - 'LICENSE'

area/examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'examples/**'

area/performance:
  - changed-files:
      - any-glob-to-any-file:
          - 'benchmarks/**'
          - 'dev_tools/profiling/**'

area/devops:
  # Exclude dev_tools/{docs,notebooks}/ because they map to area/docs.
  - changed-files:
      - all-globs-to-any-file:
          - 'dev_tools/**'
          - '!dev_tools/docs/**'
          - '!dev_tools/notebooks/**'
  - changed-files:
      - any-glob-to-any-file:
          - '.*.y*ml'
          - '.*config'
          - '.*ignore'
          - '.*rc'
          - '.git*'
          - '.github/**'
          - 'check/**'
          - 'conftest.py'
          - 'pyproject.toml'
          - 'setup.py'

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.codecov.yaml'
          - '.github/workflows/**'
          - 'dev_tools/ci/**'

area/github:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

area/python:
  # Exclude packaging test fixtures under dev_tools/modules_test_data/.
  - changed-files:
      - all-globs-to-any-file:
          - '**/setup.py'
          - '!dev_tools/modules_test_data/**'
  - changed-files:
      - any-glob-to-any-file:
          - '**/pyproject.toml'
          - 'dev_tools/requirements/deps/**'

area/dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/requirements.txt'
          - '.github/dependabot.yml'
          - 'apt-system-requirements.txt'
          - 'dev_tools/conf/**'
          - 'dev_tools/requirements/**'

area/releases:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/release-*.y*ml'
          - 'dev_tools/packaging/**'
          - 'docs/dev/release.md'
          - 'docs/dev/versions.md'
          - 'MANIFEST.in'
