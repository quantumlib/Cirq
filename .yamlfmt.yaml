# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# yamlfmt configuration to match project settings like line length.
# See https://github.com/google/yamlfmt/blob/main/docs/config-file.md
# for info about configuration options.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

formatter:
  type: basic
  line_ending: lf
  # YAML files (especially GitHub Actions workflows) tend to end up with
  # long lines. The default of 80 is pretty limiting, and besides, in Python
  # code linting, we set line lengths to 100. May as well follow suit here.
  max_line_length: 100
  # Another common occurrence in YAML files is long URLs. The next
  # setting is not specific to URLs, but helps. It saves developer time by
  # not requiring comment directives to disable warnings at every occurrence.
  retain_line_breaks: true
  # Without this, a folded scalar ('>-') immediately followed by a blank line
  # gets corrupted into a literal '#magic___^_^___line' comment in the output.
  scan_folded_as_literal: true
  # Block-sequence items can either be indented or not under their parent key,
  # and the arbitrary choice of the former was made below. Swap the boolean to true
  # and rerun `--fix` for unindented items.
  indentless_arrays: false
